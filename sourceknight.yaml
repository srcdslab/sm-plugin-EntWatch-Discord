project:
  sourceknight: 0.3
  name: EntWatch_Discord

  dependencies:
    - name: sourcemod
      type: tar
      version: 1.12
      location: https://sm.alliedmods.net/smdrop/1.12/sourcemod-1.12.0-git7165-linux.tar.gz
      unpack:
        - source: /addons
          dest: /addons

    - name: sbpp
      type: git
      repo: https://github.com/srcdslab/sm-plugin-EntWatch
      unpack:
        - source: /addons/sourcemod/scripting/include
          dest: /addons/sourcemod/scripting/include

    - name: relayhelper
      type: git
      repo: https://github.com/srcdslab/sm-plugin-RelayHelper
      unpack:
        - source: /addons/sourcemod/scripting/include
          dest: /addons/sourcemod/scripting/include

    - name: DiscordWebhookAPI
      type: git
      repo: https://github.com/srcdslab/sm-plugin-DiscordWebhookAPI
      unpack:
        - source: /include
          dest: /addons/sourcemod/scripting/include

  root: /
  output: /addons/sourcemod/plugins

  targets:
    - EntWatch_Discord
